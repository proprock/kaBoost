name: Rust checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  checks:
    # A pushed red TDD commit fails by design; pull requests always run, so the head is still checked.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'TDD: red')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The runner's rustup follows rust-toolchain.toml when the project has one.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup component add rustfmt clippy
      - name: Use the lock file when it is committed
        run: if [ -f Cargo.lock ]; then echo "LOCKED=--locked" >> "$GITHUB_ENV"; fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy $LOCKED --workspace --all-targets -- -D warnings
      - run: cargo test $LOCKED --workspace
