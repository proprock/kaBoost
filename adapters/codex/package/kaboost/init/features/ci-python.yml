name: Checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  checks:
    # A pushed red TDD commit fails by design; pull requests always run, so the head is still checked.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'TDD: red')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --group dev
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run pytest
      - name: Build the distribution and check that it installs
        run: |
          uv build
          uv venv .dist-check
          uv pip install --python .dist-check dist/*.whl
