name: Latest clients
# KB-313: weekly lifecycle smoke tests against the newest Claude Code and Codex CLI, so client changes surface
# before a release. The release checks keep their pinned client versions; a failure here is a signal to revalidate
# compatibility (docs/compatibility.md), not a release blocker by itself.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  claude:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # Native installer without a version argument: the current release. See the KB-314 note in package-checks.yml.
      - name: Install the latest Claude Code on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the latest Claude Code on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://claude.ai/install.ps1)))
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Exercise the local marketplace lifecycle
        run: |
          claude --version
          python scripts/smoke_claude.py

  codex:
    # KB-114: the same matrix as Claude Code, plus the remote lifecycle between the two newest tags and from the
    # published catalog. The remote checks compare installed files with the tagged commits, so fetch the tags.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install -g @openai/codex@latest
      - run: codex --version
      - run: python scripts/smoke_codex.py
      # Defaults --old v0.1.1 --new v0.2.0: keep them on the two newest tags in scripts/smoke_codex_remote.py.
      - run: python scripts/smoke_codex_remote.py
      - run: python scripts/smoke_codex_remote.py --catalog proprock/marketplace

  report:
    # A failed scheduled run is otherwise visible only in the Actions tab. One open issue at a time.
    needs: [claude, codex]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open an issue unless one is already open
        shell: bash
        run: |
          open=$(gh issue list --state open --search 'in:title "Latest clients failed"' --json number --jq length)
          if [ "$open" -gt 0 ]; then
            echo "An open 'Latest clients failed' issue exists; not opening another."
            exit 0
          fi
          gh issue create --title "Latest clients failed: $(date -u +%Y-%m-%d)" \
            --body "The weekly run against the newest Claude Code and Codex CLI failed: $RUN_URL. Revalidate compatibility as docs/compatibility.md describes."
