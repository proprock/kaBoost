name: Release candidate
# Unconditional: tag pushes and manual runs always execute the full cycle, whatever files changed,
# then prepare the release artifacts. Publishing stays a manual, explicitly authorized step (KB-020).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    uses: ./.github/workflows/package-checks.yml
  artifacts:
    needs: full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python scripts/prepare_release.py --output "${{ runner.temp }}/kaboost-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaboost-release-${{ github.sha }}
          path: ${{ runner.temp }}/kaboost-release
          if-no-files-found: error
