name: Checks
# The full cycle runs only when code, tests, shipped content, or build inputs change.
# Pull requests and pushes of commits marked 'TDD: red' are handled by the gate job below.
# Text-only changes (README, TODO, DONE, CHANGELOG, docs, behavior reports) run docs-check.yml instead.
on:
  push:
    branches: ['**']
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '!tests/**/*.md'
      - '!tests/**/*.csv'
      - 'skills/**'
      - 'commands/**'
      - 'init/**'
      - 'core/**'
      - 'workflows/**'
      - 'plugins/**'
      - 'adapters/**'
      - 'evals/**'
      - 'toolkit.json'
      - '.claude-plugin/**'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.gitattributes'
      - '.devcontainer/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '!tests/**/*.md'
      - '!tests/**/*.csv'
      - 'skills/**'
      - 'commands/**'
      - 'init/**'
      - 'core/**'
      - 'workflows/**'
      - 'plugins/**'
      - 'adapters/**'
      - 'evals/**'
      - 'toolkit.json'
      - '.claude-plugin/**'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.gitattributes'
      - '.devcontainer/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  gate:
    # A pushed red TDD commit fails by design; pull requests always run, so the head is still checked.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.red.outputs.skip }}
    steps:
      - id: red
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = push ] && printf '%s' "$MESSAGE" | grep -q 'TDD: red'; then
            echo skip=true >> "$GITHUB_OUTPUT"
          else
            echo skip=false >> "$GITHUB_OUTPUT"
          fi
  full:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    uses: ./.github/workflows/package-checks.yml
