name: Checks
# The full cycle runs only when code, tests, shipped content, or build inputs change.
# Text-only changes (README, TODO, DONE, CHANGELOG, docs, behavior reports) run docs-check.yml instead.
on:
  push:
    branches: ['**']
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '!tests/**/*.md'
      - '!tests/**/*.csv'
      - 'skills/**'
      - 'commands/**'
      - 'init/**'
      - 'core/**'
      - 'workflows/**'
      - 'plugins/**'
      - 'adapters/**'
      - 'evals/**'
      - 'toolkit.json'
      - '.claude-plugin/**'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.gitattributes'
      - '.devcontainer/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '!tests/**/*.md'
      - '!tests/**/*.csv'
      - 'skills/**'
      - 'commands/**'
      - 'init/**'
      - 'core/**'
      - 'workflows/**'
      - 'plugins/**'
      - 'adapters/**'
      - 'evals/**'
      - 'toolkit.json'
      - '.claude-plugin/**'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.gitattributes'
      - '.devcontainer/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  full:
    # A pushed red TDD commit fails by design; pull requests always run, so the head is still checked.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'TDD: red') }}
    uses: ./.github/workflows/package-checks.yml
