name: Package checks (full cycle)
# Reusable: called by check.yml for code and test changes and by release-candidate.yml unconditionally.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/build.py --check
      - run: python scripts/build_codex.py --check
      - run: python scripts/validate.py
      - run: python scripts/validate_codex.py
      - run: python scripts/check_secrets.py
      - run: python -m unittest discover -s tests/packaging -v
      - run: python scripts/prepare_release.py --output "${{ runner.temp }}/kaboost-release"

  codex-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install -g @openai/codex@0.165.0
      - run: codex --version
      - run: python scripts/smoke_codex.py

  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            python scripts/validate.py
            python scripts/validate_codex.py
            python -m unittest discover -s tests/packaging -q

  native-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      # Reviewed (KB-314): the vendor's native installer is what users run. It is fetched over HTTPS from claude.ai,
      # installs the pinned version, and checks the binary's SHA-256 against the version manifest before installing.
      # The script itself is not pinned; the npm package would bypass the native installer this job is meant to test.
      - name: Install Claude Code on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.312
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Claude Code on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://claude.ai/install.ps1))) 2.1.312
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify version and exercise local marketplace lifecycle
        run: |
          claude --version
          python scripts/smoke_claude.py
      - name: Record Windows token privileges
        if: runner.os == 'Windows'
        run: whoami /priv
