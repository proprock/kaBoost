name: Package checks (full cycle)
# Reusable: called by check.yml for code and test changes and by release-candidate.yml unconditionally.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/build.py --check
      - run: python scripts/build_codex.py --check
      - run: python scripts/validate.py
      - run: python scripts/validate_codex.py
      - run: python scripts/check_secrets.py
      - run: python -m unittest discover -s tests/packaging -v
      - run: python scripts/prepare_release.py --output "${{ runner.temp }}/kaboost-release"

  codex-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @openai/codex@0.165.0
      - run: codex --version
      - run: python scripts/smoke_codex.py

  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            python scripts/validate.py
            python scripts/validate_codex.py
            python -m unittest discover -s tests/packaging -q

  native-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Claude Code on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.312
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Claude Code on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://claude.ai/install.ps1))) 2.1.312
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify version and exercise local marketplace lifecycle
        run: |
          claude --version
          python scripts/smoke_claude.py
      - name: Record Windows token privileges
        if: runner.os == 'Windows'
        run: whoami /priv
