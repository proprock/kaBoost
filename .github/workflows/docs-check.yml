name: Docs check
# Light check for text changes: canonical/generated consistency, local Markdown links, secrets scan.
on:
  push:
    branches: ['**']
    paths:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'tests/**/*.csv'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'tests/**/*.csv'
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python scripts/validate.py
      - run: python scripts/check_secrets.py
