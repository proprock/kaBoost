name: Docs check
# Light check for text changes: canonical/generated consistency, local Markdown links, secrets scan.
on:
  push:
    branches: ['**']
    paths:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'tests/**/*.csv'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'tests/**/*.csv'
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/validate.py
      - run: python scripts/check_secrets.py
